version: '3.9'

services:
  api:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      ALLOWED_ORIGINS: "*"
      DATABASE_URL: sqlite:////app/data/irctc.db
    volumes:
      - irctc-data:/app/data

  frontend:
    build:
      context: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  irctc-data:
